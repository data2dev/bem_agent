[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bem_agent"
version = "0.1.0"
description = "An LLM agent that drives EnergyPlus building energy simulations through MCP tool calls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "matplotlib>=3.8",
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bem_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "energyplus: tests that need a local EnergyPlus install (ENERGYPLUS_DIR)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # verbatim EnergyPlus output in fixtures
